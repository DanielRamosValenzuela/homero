name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["18", "20"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax-check the CLI
        run: node --check packages/cli/bin/homero.mjs

      - name: Smoke-test the npm script wrappers
        run: |
          npm run bootstrap -- --help
          npm run validate:target -- --help

      - name: Run self-test
        run: npm run validate:self
